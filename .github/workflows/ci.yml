name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  java-testleri:
    name: Java (api-service) testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testleri çalıştır
        working-directory: api-service
        run: mvn test

  python-testleri:
    name: Python (sentiment-service) testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sentiment-service/requirements.txt
      - name: Bağımlılıkları kur
        working-directory: sentiment-service
        run: pip install -r requirements.txt
      - name: Testleri çalıştır
        working-directory: sentiment-service
        run: python -m pytest tests/ -v
