services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geri_bildirim_zekasi
      POSTGRES_USER: gbz_user
      POSTGRES_PASSWORD: gbz_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
